# Default YAML header for knitted reports in this project.
# Copy the block between the --- fences to the top of an .Rmd file.
# Carried over from the SIPA U6614 template; title and author filled in for
# this project. Keep both output formats so a report knits to HTML for
# reading and PDF for submission without editing the header.
---
title: 'The Politics of NAs: Mapping Data Loss During Autocratization'
subtitle: 'Section X'
author: 'Sevastian Sanchez'
