output:
  html_document:
    toc: yes
    toc_depth: 3
    toc_float: yes
    number_sections: yes
    highlight: tango
    theme: default
    fig_caption: yes
    df_print: tibble
  pdf_document:
    toc: no
    toc_depth: '3'
    number_sections: yes
