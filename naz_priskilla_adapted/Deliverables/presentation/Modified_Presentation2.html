# Introduction and Research Motivation

*Since January 2025, over 3000 publicly funded datasets have been struck down at the federal level (ASA, 2025).*

When it comes to democratic governance, transparency and access to information are crucial elements of accountability and informed decision-making. While under-acknowledged, without accurate, independent, and accessible data(sets), policymakers cannot craft effective responses to economic challenges, public health crises, or social issues that affect their constituents.

At a time when countries increasingly experiencing &lt;span class="underline"&gt;democratic backsliding&lt;/span&gt;, we ask:

**Research Question:** *Is this missingness a function of democratic backsliding? In other words, How does data availability react to democratic regression?*

**Motivation:** If we understand how data/information acts during democratic backsliding (on average), could we possibly predict policy and development outcomes?

---

# Policy Background 

**Democratic backsliding** refers to the gradual decline in the quality of democracy within a country, often characterized by:
- Erosion of civil liberties  
- Weakening of different forms of institutional checks and balances  
- *Manipulation, weponization and suppression of information (Georgiou, 2021)*  

**Existing literature** supporting the association between lack of transparency and regime type (e.g., Steven Levitsky &amp; Daniel Ziblatt, 2018; Hollyer et al., 2010; Jeskanen-Sundström, 2007) 

**Hypothesis 1: autocratization is associated with weaker SDG reporting.** We speculate that SDG data is de-prioritized and/or intentionally purged relative to the survival of autocratic regimes.

# Panel Structure &amp; Key Variables

| N Countries| Min Year| Max Year| N Years| N Country-Years|
|-----------:|--------:|--------:|-------:|---------------:|
|         172|     2015|     2023|       8|            1548|

**Outcome Variable: Data Missingness**
- UN SDG Index dataset (Sachs et al. 2022), analyzing **126** unique indicators.
- **Missingness:** Proportion of SDG indicators that are missing from the SDG Index dataset for country `\(i\)` in year `\(t\)`. 
  `$$\text{Share of Missingness}_{it} = \frac{\text{N Missing Indicators}_{it}}{\text{Total Number of Indicators}}$$`

**Explanatory Variables: Democracy Status**  
&lt;u&gt;Electoral Democracy Index (V-Dem)&lt;/u&gt; -- Continuous (0-1 scale)
- Future: Cross-validation with other democracy indices (e.g., V-Dem Liberal Democracy Index, EIU’s Democracy Index

&lt;u&gt;Autocratization Episodes (V-Dem ERT)&lt;/u&gt; -- Binary/Dummy Indicators
- Regime status variables (i.e., regime type, regime full transition, etc.)
- Autocratization episode (aut_ep) &amp; start year (aut_ep_start_yr)
---

## Proxies and Controls 
**Time-Varying Controls**: National SDG reporting of countries can be shaped by statistical capacity and political willingness to report

**Statistical Capacity**: The ability of a national statistical system to produce and disseminate high-quality statistical information that meets the needs of users (i.e., tech and infrastructure, national surveys/frequency, etc.)

**Proxies of Statistical capacity:** 
- `\(log(\text{GDP per capita})\)`, 
- `\(log(\text{population})\)` 
- Electricity access
- Research &amp; Development Expenditure (%), 
- Rural population (%)

# Empirical Strategy: Staggered DiD

We estimate: 

`$$Y_{it} = \alpha_i + \lambda_t + ATT_{g,t} \cdot D_{it} + X_{it}\gamma + \varepsilon_{it}$$`

Where:

- `\(Y_{it}\)`: SDG missingness in country `\(i\)`, year `\(t\)` 
- `\(D_{it}\)`: indicator that country \(i\) is treated (autocratized) in year \(t\)
- `\(ATT_{g,t}\)`: group-time average treatment effect for countries first treated at time \(g\)
- `\(X_{it}\)`: socioeconomic controls (GDPpc, electricity access, rural pop share, R&amp;D spending)
- `\(\alpha_i\)`: country fixed effects
- `\(\lambda_t\)`: year fixed effects
- `\(\varepsilon_{it}\)`: error term

This formulation allows treatment effects to differ depending on the year  
each country autocratized.

---

# Challenges

- **Few treated units** within the SDG time window (post-2015).
- **Limited pre-treatment years** restricts parallel trends assessment.
- **Measurement issues** in SDG indicators (different goals = different reporting burdens).

These constraints impact statistical power and interpretation.

---

# Future Strategy

To further **strengthen causal identification**, we plan to:

- Restrict sample to "sufficiently democratic" countries pre-episode to avoid bias from very low-capacity/borderline states.

- Heterogeneous treatment effects
